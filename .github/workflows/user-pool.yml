# User pool maintenance and optional verify gate (non-production).
# Secrets: SIGNUP_ROPC_CLIENT_SECRET (or STS_SECRET) for verify-ropc / k6 runs.

name: load-test-user-pool

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  pool-gc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: load-testing-k6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pool-cli
        run: npm install --prefix tools/pool-cli

      - name: Restore pool.db cache
        uses: actions/cache@v4
        with:
          path: load-testing-k6/data/user-pool/dev/pool.db
          key: pool-db-dev-v1-${{ hashFiles('load-testing-k6/tools/pool-cli/src/**') }}
          restore-keys: |
            pool-db-dev-v1-

      - name: Import lifecycle-users if present
        run: |
          if [ -f lifecycle-users.json ]; then
            node tools/pool-cli/bin/pool-cli.js import-json lifecycle-users.json --env dev
          else
            echo "No lifecycle-users.json in workspace; using cached pool.db only."
          fi

      - name: GC expired leases
        run: node tools/pool-cli/bin/pool-cli.js gc --env dev --clear-expired-leases

      - name: Pool stats
        run: node tools/pool-cli/bin/pool-cli.js stats --env dev

      - name: Verify ROPC sample (optional)
        if: ${{ secrets.SIGNUP_ROPC_CLIENT_SECRET != '' }}
        env:
          SIGNUP_ROPC_CLIENT_SECRET: ${{ secrets.SIGNUP_ROPC_CLIENT_SECRET }}
        run: node tools/pool-cli/bin/pool-cli.js verify-ropc --env dev --sample 3
        continue-on-error: true

      - name: Save pool.db cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: load-testing-k6/data/user-pool/dev/pool.db
          key: pool-db-dev-v1-${{ hashFiles('load-testing-k6/tools/pool-cli/src/**') }}
