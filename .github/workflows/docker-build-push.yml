name: Build, Push & Deploy (Docker Hub)

on:
  push:
    branches:
      - iteration-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve environment, image, and tag
        id: vars
        shell: bash
        run: |
          ENVIRONMENT="dev"
          TAG_NUM=$((GITHUB_RUN_NUMBER))
          TAG="${ENVIRONMENT}-frontend${TAG_NUM}"

          # Docker requires lowercase repo names
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_LOWER}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "full_image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (pull/stop/rm/run)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            IMAGE="${{ steps.vars.outputs.full_image }}"
            NAME="ibernia-app"

            docker pull "$IMAGE"
            docker stop "$NAME" || true
            docker rm "$NAME" || true
            docker run -d -p 8082:80 --name "$NAME" "$IMAGE"
            docker image prune -f
