name: Build & Push Docker Image (Docker Hub)

on:
  push:
    branches:
      - iteration-4
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve environment & tag
        id: vars
        shell: bash
        run: |
          # Decide environment from branch
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          TAG_NUM=$((GITHUB_RUN_NUMBER))

          echo "env=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "tag=${ENVIRONMENT}-frontend${TAG_NUM}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
