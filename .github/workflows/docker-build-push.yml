name: Build, Push & Deploy (Docker Hub)
on:
  push:
    branches:
      - feature/iteration-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need parent commit so we can diff changed files for ibernia-portal-tests (no second-repo checkout).
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve environment, image, and tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          # Auto version: MAJOR.MINOR.PATCH (PATCH from run number)
          MAJOR="${{ vars.VERSION_MAJOR }}"
          MINOR="${{ vars.VERSION_MINOR }}"
          PATCH="${GITHUB_RUN_NUMBER}"

          if [[ -z "$MAJOR" || -z "$MINOR" ]]; then
            echo "ERROR: VERSION_MAJOR / VERSION_MINOR variables are not set"
            exit 1
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          VERSION_TAG="${ENVIRONMENT}-${VERSION}"
          SHA_TAG="sha-${GITHUB_SHA}"
          LATEST_TAG="${ENVIRONMENT}-latest"

          # Docker requires lowercase repo names
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_LOWER}"

          # Angular build configuration: prod -> production (api.ibernia.it), dev -> development (api-dev.ibernia.it)
          NG_CONFIG="production"
          if [[ "$ENVIRONMENT" == "dev" ]]; then
            NG_CONFIG="development"
          fi
          echo "ng_config=${NG_CONFIG}" >> "$GITHUB_OUTPUT"

          echo "env=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log Angular build configuration
        run: |
          echo "ENVIRONMENT=${{ steps.vars.outputs.env }}"
          echo "NG_BUILD_CONFIGURATION=${{ steps.vars.outputs.ng_config }}"
          if [ -z "${{ steps.vars.outputs.ng_config }}" ]; then
            echo "ERROR: ng_config is empty - Angular will use default (production)"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NG_BUILD_CONFIGURATION=${{ steps.vars.outputs.ng_config }}
            CACHE_BUST=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (pull/stop/rm/run)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            ENV="${{ steps.vars.outputs.env }}"
            IMAGE="${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version_tag }}"
            if [ "$ENV" = "prod" ]; then
              NAME="ibernia-app"
              PORT="8082"
              DEPLOY_DIR="/opt/ibernia/prod"
              ASPNETCORE_ENVIRONMENT="Production"
            else
              NAME="ibernia-app-dev"
              PORT="8085"
              DEPLOY_DIR="/opt/ibernia/dev"
              ASPNETCORE_ENVIRONMENT="Development"
            fi

            echo "Deploying ENV=$ENV NAME=$NAME PORT=$PORT IMAGE=$IMAGE"

            sudo mkdir -p "$DEPLOY_DIR"

            docker pull "$IMAGE"
            docker stop "$NAME" || true
            docker rm "$NAME" || true

            docker run -d \
              --restart unless-stopped \
              -p "${PORT}:80" \
              -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
              --name "$NAME" \
              "$IMAGE"

            echo "$IMAGE" | sudo tee "${DEPLOY_DIR}/DEPLOYED_VERSION.txt" >/dev/null

            docker image prune -f

      - name: Notify ibernia-portal-tests repo (repository_dispatch)
        if: success()
        env:
          TESTS_REPO_TOKEN: ${{ secrets.TESTS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TESTS_REPO_TOKEN}" ]; then
            echo "TESTS_REPO_TOKEN is not set; skipping repository_dispatch to ibernia-portal-tests."
            exit 0
          fi
          # List files changed in this push (for impacted test selection in ibernia-portal-tests).
          # Avoids checking out the private portal repo from the tests workflow (no extra PAT).
          CHANGED_FILES_JSON='[]'
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            _lines="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
            if [ -n "${_lines}" ]; then
              CHANGED_FILES_JSON="$(printf '%s\n' "${_lines}" | jq -R . | jq -s .)"
            fi
          fi
          PAYLOAD=$(jq -n \
            --arg event "portal_deployed" \
            --arg sha "${GITHUB_SHA}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg env "${{ steps.vars.outputs.env }}" \
            --arg baseUrl "https://test-dev.ibernia.it" \
            --arg versionTag "${{ steps.vars.outputs.version_tag }}" \
            --argjson changedFiles "${CHANGED_FILES_JSON}" \
            '{event_type: $event, client_payload: {portal_sha: $sha, portal_branch: $branch, environment: $env, baseUrl: $baseUrl, versionTag: $versionTag, changedFiles: $changedFiles}}')
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TESTS_REPO_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Ibernia-fa/ibernia-portal-tests/dispatches" \
            -d "${PAYLOAD}"
