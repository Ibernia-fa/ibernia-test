name: Build, Push & Deploy (Docker Hub)
on:
  push:
    branches:
      - feature/iteration-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright login tests
        run: BASE_URL=https://test-dev.ibernia.it/ npm run test:e2e:login

      - name: Upload Playwright login report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-login-report
          path: playwright-report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve environment, image, and tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          # Auto version: MAJOR.MINOR.PATCH (PATCH from run number)
          MAJOR="${{ vars.VERSION_MAJOR }}"
          MINOR="${{ vars.VERSION_MINOR }}"
          PATCH="${GITHUB_RUN_NUMBER}"

          if [[ -z "$MAJOR" || -z "$MINOR" ]]; then
            echo "ERROR: VERSION_MAJOR / VERSION_MINOR variables are not set"
            exit 1
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          VERSION_TAG="${ENVIRONMENT}-${VERSION}"
          SHA_TAG="sha-${GITHUB_SHA}"
          LATEST_TAG="${ENVIRONMENT}-latest"

          # Docker requires lowercase repo names
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_LOWER}"

          # Angular build configuration: prod -> production (api.ibernia.it), dev -> development (api-dev.ibernia.it)
          NG_CONFIG="production"
          if [[ "$ENVIRONMENT" == "dev" ]]; then
            NG_CONFIG="development"
          fi
          echo "ng_config=${NG_CONFIG}" >> "$GITHUB_OUTPUT"

          echo "env=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log Angular build configuration
        run: |
          echo "ENVIRONMENT=${{ steps.vars.outputs.env }}"
          echo "NG_BUILD_CONFIGURATION=${{ steps.vars.outputs.ng_config }}"
          if [ -z "${{ steps.vars.outputs.ng_config }}" ]; then
            echo "ERROR: ng_config is empty - Angular will use default (production)"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NG_BUILD_CONFIGURATION=${{ steps.vars.outputs.ng_config }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (pull/stop/rm/run)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            ENV="${{ steps.vars.outputs.env }}"
            IMAGE="${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version_tag }}"
            if [ "$ENV" = "prod" ]; then
              NAME="ibernia-app"
              PORT="8082"
              DEPLOY_DIR="/opt/ibernia/prod"
              ASPNETCORE_ENVIRONMENT="Production"
            else
              NAME="ibernia-app-dev"
              PORT="8085"
              DEPLOY_DIR="/opt/ibernia/dev"
              ASPNETCORE_ENVIRONMENT="Development"
            fi

            echo "Deploying ENV=$ENV NAME=$NAME PORT=$PORT IMAGE=$IMAGE"

            sudo mkdir -p "$DEPLOY_DIR"

            docker pull "$IMAGE"
            docker stop "$NAME" || true
            docker rm "$NAME" || true

            docker run -d \
              --restart unless-stopped \
              -p "${PORT}:80" \
              -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
              --name "$NAME" \
              "$IMAGE"

            echo "$IMAGE" | sudo tee "${DEPLOY_DIR}/DEPLOYED_VERSION.txt" >/dev/null

            docker image prune -f

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests (post-deploy)
        run: BASE_URL=https://test-dev.ibernia.it/ npm run test:e2e:ci
        continue-on-error: true

      - name: Upload Playwright report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ steps.vars.outputs.env }}
          path: playwright-report
        continue-on-error: true

      - name: Upload Playwright report to app server
        if: always()
        uses: appleboy/scp-action@v0.1.7
        env:
          REPORT_ENV: ${{ steps.vars.outputs.env }}
          REPORT_VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "playwright-report/*"
          target: /opt/ibernia/${{ env.REPORT_ENV }}/playwright-report/${{ env.REPORT_VERSION_TAG }}
          overwrite: true

      - name: Update Playwright report index on server
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            ENV="${{ steps.vars.outputs.env }}"
            VERSION="${{ steps.vars.outputs.version }}"
            VERSION_TAG="${{ steps.vars.outputs.version_tag }}"

            INDEX_DIR="/opt/ibernia/${ENV}/playwright-index"
            INDEX_FILE="${INDEX_DIR}/index.json"
            REPORT_PATH="/playwright-report/${VERSION_TAG}/"

            sudo mkdir -p "${INDEX_DIR}"

            tmp="$(mktemp)"
            if [ -f "${INDEX_FILE}" ]; then
              sudo cat "${INDEX_FILE}" > "${tmp}"
            else
              echo "[]" > "${tmp}"
            fi

            # Append or replace entry for this VERSION_TAG
            node - <<'NODE' "${tmp}" "${INDEX_FILE}" "${ENV}" "${VERSION}" "${VERSION_TAG}" "${REPORT_PATH}"
            const [tmpPath, indexPath, env, version, versionTag, reportPath] = process.argv.slice(2);
            const fs = require('fs');

            let data = [];
            try {
              data = JSON.parse(fs.readFileSync(tmpPath, 'utf8'));
              if (!Array.isArray(data)) data = [];
            } catch {
              data = [];
            }

            const now = new Date().toISOString();
            const entry = {
              environment: env,
              version,
              versionTag,
              deployedAt: now,
              reportUrl: reportPath,
            };

            const existingIndex = data.findIndex((d) => d.versionTag === versionTag);
            if (existingIndex >= 0) {
              data[existingIndex] = entry;
            } else {
              data.push(entry);
            }

            fs.writeFileSync(indexPath, JSON.stringify(data, null, 2));
            NODE

            # Ensure index HTML is present alongside index.json
            if [ ! -f "${INDEX_DIR}/index.html" ]; then
              sudo cp /opt/ibernia/${ENV}/playwright-report-index.html "${INDEX_DIR}/index.html" || true
            fi
