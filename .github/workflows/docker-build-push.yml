name: Build, Push & Deploy (Docker Hub)
on:
  push:
    branches:
      - feature/iteration-4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright login tests
        run: npm run test:e2e:login

      - name: Upload Playwright login report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-login-report
          path: playwright-report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve environment, image, and tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            ENVIRONMENT="prod"
          else
            ENVIRONMENT="dev"
          fi

          # Auto version: MAJOR.MINOR.PATCH (PATCH from run number)
          MAJOR="${{ vars.VERSION_MAJOR }}"
          MINOR="${{ vars.VERSION_MINOR }}"
          PATCH="${GITHUB_RUN_NUMBER}"

          if [[ -z "$MAJOR" || -z "$MINOR" ]]; then
            echo "ERROR: VERSION_MAJOR / VERSION_MINOR variables are not set"
            exit 1
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          VERSION_TAG="${ENVIRONMENT}-${VERSION}"
          SHA_TAG="sha-${GITHUB_SHA}"
          LATEST_TAG="${ENVIRONMENT}-latest"

          # Docker requires lowercase repo names
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_LOWER}"

          # Angular build configuration: prod -> production (api.ibernia.it), dev -> development (api-dev.ibernia.it)
          NG_CONFIG="production"
          if [[ "$ENVIRONMENT" == "dev" ]]; then
            NG_CONFIG="development"
          fi
          echo "ng_config=${NG_CONFIG}" >> "$GITHUB_OUTPUT"

          echo "env=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log Angular build configuration
        run: |
          echo "ENVIRONMENT=${{ steps.vars.outputs.env }}"
          echo "NG_BUILD_CONFIGURATION=${{ steps.vars.outputs.ng_config }}"
          if [ -z "${{ steps.vars.outputs.ng_config }}" ]; then
            echo "ERROR: ng_config is empty - Angular will use default (production)"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NG_BUILD_CONFIGURATION=${{ steps.vars.outputs.ng_config }}
            CACHE_BUST=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (pull/stop/rm/run)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            ENV="${{ steps.vars.outputs.env }}"
            IMAGE="${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version_tag }}"
            if [ "$ENV" = "prod" ]; then
              NAME="ibernia-app"
              PORT="8082"
              DEPLOY_DIR="/opt/ibernia/prod"
              ASPNETCORE_ENVIRONMENT="Production"
            else
              NAME="ibernia-app-dev"
              PORT="8085"
              DEPLOY_DIR="/opt/ibernia/dev"
              ASPNETCORE_ENVIRONMENT="Development"
            fi

            echo "Deploying ENV=$ENV NAME=$NAME PORT=$PORT IMAGE=$IMAGE"

            sudo mkdir -p "$DEPLOY_DIR"

            docker pull "$IMAGE"
            docker stop "$NAME" || true
            docker rm "$NAME" || true

            docker run -d \
              --restart unless-stopped \
              -p "${PORT}:80" \
              -e ASPNETCORE_ENVIRONMENT="$ASPNETCORE_ENVIRONMENT" \
              --name "$NAME" \
              "$IMAGE"

            echo "$IMAGE" | sudo tee "${DEPLOY_DIR}/DEPLOYED_VERSION.txt" >/dev/null

            docker image prune -f

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests (post-deploy)
        run: npm run test:e2e:ci
        continue-on-error: true

      - name: Upload Playwright report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report-${{ steps.vars.outputs.env }}
          path: playwright-report
        continue-on-error: true

      - name: Set up SSH key for file transfers
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload Playwright report to app server
        if: always()
        continue-on-error: true
        run: |
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || 22 }}"
          TARGET="/opt/ibernia/dev/playwright-report/playwright-report/reports/${{ steps.vars.outputs.version_tag }}"
          ssh -p "$PORT" -i ~/.ssh/deploy_key "$REMOTE" "sudo mkdir -p $TARGET"
          scp -r -P "$PORT" -i ~/.ssh/deploy_key playwright-report/* "$REMOTE:$TARGET/"

      - name: Build version report link file
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: |
          set -euo pipefail
          cat > "${VERSION_TAG}-report.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=./reports/${VERSION_TAG}/index.html" />
              <title>Redirecting to Playwright report</title>
            </head>
            <body>
              <p>Redirecting to <a href="./reports/${VERSION_TAG}/index.html">Playwright report</a>…</p>
              <script>
                window.location.replace('./reports/${VERSION_TAG}/index.html');
              </script>
            </body>
          </html>
          EOF

      - name: Upload version report link file to server root
        if: always()
        continue-on-error: true
        run: |
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || 22 }}"
          TARGET="/opt/ibernia/dev/playwright-report/playwright-report"
          scp -P "$PORT" -i ~/.ssh/deploy_key "${{ steps.vars.outputs.version_tag }}-report.html" "$REMOTE:$TARGET/"

      - name: Register report in dashboard index.json
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail

            REPORT_DIR="/opt/ibernia/dev/playwright-report/playwright-report"
            INDEX_FILE="${REPORT_DIR}/index.json"
            VERSION_TAG="${{ steps.vars.outputs.version_tag }}"
            ENV="${{ steps.vars.outputs.env }}"
            VERSION="${{ steps.vars.outputs.version }}"
            REPORT_URL="./${VERSION_TAG}-report.html"
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            PIPELINE="Build, Push & Deploy (Docker Hub)"

            sudo mkdir -p "$REPORT_DIR"

            if [ ! -f "$INDEX_FILE" ]; then
              echo "[]" | sudo tee "$INDEX_FILE" > /dev/null
            fi

            NEW_ENTRY=$(jq -n \
              --arg vt "$VERSION_TAG" \
              --arg v  "$VERSION" \
              --arg env "$ENV" \
              --arg da "$DEPLOYED_AT" \
              --arg ru "$REPORT_URL" \
              --arg pl "$PIPELINE" \
              '{versionTag: $vt, version: $v, environment: $env, deployedAt: $da, reportUrl: $ru, pipeline: $pl}')

            jq --argjson entry "$NEW_ENTRY" '. += [$entry]' "$INDEX_FILE" \
              | sudo tee "${INDEX_FILE}.tmp" > /dev/null

            sudo mv "${INDEX_FILE}.tmp" "$INDEX_FILE"

      - name: Upload dashboard index.html to server
        if: always()
        continue-on-error: true
        run: |
          REMOTE="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          PORT="${{ secrets.SERVER_PORT || 22 }}"
          TARGET="/opt/ibernia/dev/playwright-report/playwright-report"
          scp -P "$PORT" -i ~/.ssh/deploy_key index.html "$REMOTE:$TARGET/"

      - name: Notify ibernia-portal-tests repo (repository_dispatch)
        if: success()
        env:
          TESTS_REPO_TOKEN: ${{ secrets.TESTS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TESTS_REPO_TOKEN}" ]; then
            echo "TESTS_REPO_TOKEN is not set; skipping repository_dispatch to ibernia-portal-tests."
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg event "portal_deployed" \
            --arg sha "${GITHUB_SHA}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg env "${{ steps.vars.outputs.env }}" \
            --arg baseUrl "https://test-dev.ibernia.it" \
            --arg versionTag "${{ steps.vars.outputs.version_tag }}" \
            '{event_type: $event, client_payload: {portal_sha: $sha, portal_branch: $branch, environment: $env, baseUrl: $baseUrl, versionTag: $versionTag}}')
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TESTS_REPO_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Ibernia-fa/ibernia-portal-tests/dispatches" \
            -d "${PAYLOAD}"
