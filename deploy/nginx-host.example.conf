# Example: single host Nginx terminating TLS in front of Docker (optional architecture).
# Your CI maps: dev -> ibernia-app-dev:8085, prod -> ibernia-app:8082 (see .github/workflows/docker-build-push.yml).
#
# Replace SSL paths and upstream ports to match your VPS. Cloudflare SSL mode "Full" or "Full (strict)".
#
# Cache headers: if you terminate here, you can mirror dev vs prod behavior; otherwise rely on container nginx + Cloudflare.

upstream ibernia_prod {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream ibernia_dev {
    server 127.0.0.1:8085;
    keepalive 32;
}

# If this host proxies /api to the backend, raise body size — default nginx client_max_body_size is 1m
# and JSON with two base64 images will return 413. Match or exceed Kestrel MaxRequestBodySize in Program.cs.
# client_max_body_size 20m;

server {
    listen 443 ssl http2;
    server_name ibernia.it www.ibernia.it;

    # ssl_certificate /etc/letsencrypt/live/ibernia.it/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ibernia.it/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://ibernia_prod;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.ibernia.it;

    # ssl_certificate ... (same or separate cert)

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://ibernia_dev;
    }
}
