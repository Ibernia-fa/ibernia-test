# Production: versioning-first. Baked into Docker images built with NG_BUILD_CONFIGURATION=production.
# Angular production build uses outputHashing=all for JS/CSS; public assets under src/assets keep stable names.
#
# add_header: each location that sends a response sets headers explicitly (nginx does not merge add_header
# from parent levels when a child uses add_header — avoid relying on inheritance).

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /index.html;

    # Entry HTML: always revalidate — new deploys must be visible without purge
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.csr.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Angular fingerprinted bundles (8+ hex hash before extension)
    location ~* \.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]+\.(js|css)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Non-fingerprinted static files (icons, images, fonts): short TTL + revalidation
    # RISK: same-path updates can be stale until TTL expires or CDN purged — migrate to hashed names or build-time revision.
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|avif|woff2?|eot|ttf)$ {
        expires 5m;
        access_log off;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Service worker must update quickly after deploy
    location ~* ^/(ngsw-worker\.js|ngsw\.json)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
}
