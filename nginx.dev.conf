# Dev / staging: freshness-first. Baked into Docker images built with NG_BUILD_CONFIGURATION=development.
# Cloudflare should also bypass or minimize edge cache for dev.ibernia.it (see deploy docs in repo root response).
#
# Why no-store (not just no-cache):
# - no-cache still allows storing and revalidating; devs expect immediate visibility after deploy.
# - no-store stops HTTP caches (browser, intermediate) from persisting the response body for this URL.
# - Combined with Cloudflare Bypass on dev, you avoid stale same-name assets during iteration.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /index.html;

    # SPA shell — always fetch fresh so new chunk hashes are discovered
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # If Angular emits alternate entry (SSR / CSR), keep parity with index
    location = /index.csr.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Hashed bundles (outputHashing: all) — still use no-store on dev so engineers never chase ghosts
    location ~* \.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]+\.(js|css)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
        access_log off;
    }

    # Same-name risk: SVGs, images, fonts under /assets/ etc.
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|avif|woff2?|eot|ttf)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
        access_log off;
    }

    # Service worker / PWA metadata — never cache on dev (even if accidentally present)
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }
}
