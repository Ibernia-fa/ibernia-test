<div class="login-page">
  <!-- Left side -->
  <div class="form-section">
    <div class="form-section-inner">
      <header>
        <div class="inner-header">
          <img src="assets/images/reports/logo-symbol.png" alt="Ibernia logo" class="logo" />
        </div>
      </header>

      <form (ngSubmit)="onSubmit()" class="signup-form">
        <h1>Discover the plan built for you</h1>

        <div class="input-group password-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter password"
              [(ngModel)]="password"
              name="password"
              (keyup.enter)="onSubmit()"
              autocomplete="off"
              class="form-control"
            />
            <span class="eye-icon" (click)="togglePassword()">
              <img
                [src]="showPassword ? 'assets/images/reports/hide.png' : 'assets/images/reports/view.png'"
                width="22"
                alt="Toggle password"
              />
            </span>
          </div>
        </div>

        <div class="text-center mt-3">
          <button class="btn btn-primary w-100" type="submit">
            {{ isLoaderVisible ? 'Verifying...' : 'View' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Right side -->
  <div class="visual-section">
    <div class="headline">
      <h2>Your future. Simplified.</h2>
      <p>See your financial outlook through data that tells a story</p>
    </div>
    <div class="mockup">
      <img src="assets/images/reports/app-thumb.png" alt="Report preview" />
    </div>
  </div>
</div>
