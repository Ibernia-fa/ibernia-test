<!-- password section -->
    <ng-container *ngIf="!isAuthenticated">
        <app-view-report-password
            (submitPassword)="onSubmitPassword($event)">
        </app-view-report-password>
    </ng-container>
    
<div class="d-flex gap-24 flex-column p-20">
    <!-- loader -->
    <div class="loader" *ngIf="isLoaderVisible">
        <mat-spinner></mat-spinner>
    </div>

    <!-- report section  -->
    <ng-container *ngIf="isAuthenticated && !isLoaderVisible && financialSeries">
       <app-view-report [financialSeries]="financialSeries"></app-view-report>
    </ng-container>
</div>
