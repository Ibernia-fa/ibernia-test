<div class="d-flex gap-24 flex-column">
    <!-- loader -->
    <div class="full-screen-loader" *ngIf="isLoaderVisible">
        <mat-spinner></mat-spinner>
    </div>

    <!-- password section -->
    <ng-container *ngIf="!isAuthenticated">
        <app-view-report-password (submitPassword)="onSubmitPassword($event)">
        </app-view-report-password>
    </ng-container>

    <!-- welcome dialog -->
    <ng-template #welcomeDialog>
        <div class="w-100">
            <div class="d-flex flex-column gap-32">
                <mat-dialog-content>
                    <div class="d-flex flex-column gap-20">
                        <h2>Welcome to your Lifetime Plan, <strong>{{lifetimePlanName}}</strong></h2>
                        <p>This view was created by <strong>{{advisorName}}</strong> to help you understand how your finances may evolve
                            over time: clear, simple, and personalized for you. Feel free to browse around to check
                            inputs and assumptions.</p>
                    </div>
                </mat-dialog-content>

                <div class="row justify-content-between modal-action">
                    <button type="button" class="button-icon w-100 d-block" (click)="onContinue()" mat-dialog-close>
                        <span class="f-s-16">Continue</span>
                    </button>
                </div>
            </div>
        </div>
    </ng-template>

    <!-- report section  -->
    <ng-container *ngIf="isAuthenticated && !isLoaderVisible && financialSeries">
        <app-view-report [financialSeries]="financialSeries"></app-view-report>
    </ng-container>
</div>
