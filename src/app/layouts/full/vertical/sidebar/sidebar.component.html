<!-- Sidebar header: logo + toggle (toggle only when expanded; when collapsed, toggle is in header) -->
<div class="sidebar-header">
  
  <!-- <div
    class="sidebar-logo-link"
    [class.sidebar-logo-link--custom]="!!brandingLogo"
  > -->
  <!-- Defaults stay mounted; custom logo overlays when set (avoids blank flash on remove). -->
  @if (!brandingLogo) {
    <a href="/" class="d-flex align-items-center gap-5">
      <img
        [src]="staticCollapsedLogoSrc"
        alt="Ibernia logo"
        loading="eager"
        fetchpriority="high"
        decoding="sync"
      />
      <img
        class="sidebar-ibernia-text-logo"
        [class.sidebar-ibernia-text-logo--collapsed]="sidenavCollapsed"
        src="../../../../../assets/images/logos/ibernia-text-logo.png"
        alt="Ibernia text logo"
        loading="eager"
        fetchpriority="high"
        decoding="sync"
        [attr.aria-hidden]="sidenavCollapsed ? true : null"
      />
    </a>
  }
  <!-- <div class="sidebar-static-logos">
  <a
        href="/"
        class="sidebar-static-logo-slot sidebar-static-logo-slot--expanded"
        [class.sidebar-static-logo-slot--active]="!sidenavCollapsed"
        [attr.aria-hidden]="sidenavCollapsed || null"
        [attr.tabindex]="sidenavCollapsed ? -1 : null"
      >
        <img
          [src]="staticExpandedLogoSrc"
          alt="Ibernia"
          class="sidebar-default-logo"
          loading="eager"
          fetchpriority="high"
          decoding="sync"
        />
      </a>
  <a
        href="/"
        class="sidebar-static-logo-slot sidebar-static-logo-slot--collapsed"
        [class.sidebar-static-logo-slot--active]="sidenavCollapsed"
        [attr.aria-hidden]="!sidenavCollapsed || null"
        [attr.tabindex]="!sidenavCollapsed ? -1 : null"
      >
        <img
          [src]="staticCollapsedLogoSrc"
          alt="Ibernia"
          class="sidebar-mini-logo"
          width="48"
          height="48"
          loading="eager"
          fetchpriority="high"
          decoding="sync"
        />
      </a>
  </div> -->
  @if (brandingLogo) {
    @if (sidenavCollapsed) {
      <a href="/" class="d-flex align-items-center gap-5">
        <img
          [src]="staticCollapsedLogoSrc"
          alt="Ibernia logo"
          loading="eager"
          fetchpriority="high"
          decoding="sync"
        />
      </a>
    } @else {
      <app-branding [profileImage]="brandingLogo"></app-branding>
    }
  }
  <!-- </div> -->
  @if (showToggle && !isSettings) {
    <button
      mat-icon-button
      (click)="toggleMobileNav.emit()"
      class="sidebar-toggle-btn"
      aria-label="Close menu"
    >
      <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
    </button>
  } @else if (!sidenavCollapsed && !isSettings) {
    <button
      (click)="toggleCollapsed.emit()"
      class="sidebar-toggle-btn"
      aria-label="Toggle sidebar"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M14.97 22.75H8.96997C3.53997 22.75 1.21997 20.43 1.21997 15V9C1.21997 3.57 3.53997 1.25 8.96997 1.25H14.97C20.4 1.25 22.72 3.57 22.72 9V15C22.72 20.43 20.41 22.75 14.97 22.75ZM8.96997 2.75C4.35997 2.75 2.71997 4.39 2.71997 9V15C2.71997 19.61 4.35997 21.25 8.96997 21.25H14.97C19.58 21.25 21.22 19.61 21.22 15V9C21.22 4.39 19.58 2.75 14.97 2.75H8.96997Z"
          fill="#9EA0A2"
        />
        <path
          d="M7.96997 22.75C7.55997 22.75 7.21997 22.41 7.21997 22V2C7.21997 1.59 7.55997 1.25 7.96997 1.25C8.37997 1.25 8.71997 1.59 8.71997 2V22C8.71997 22.41 8.38997 22.75 7.96997 22.75ZM14.97 15.31C14.78 15.31 14.59 15.24 14.44 15.09L11.88 12.53C11.7405 12.3889 11.6623 12.1984 11.6623 12C11.6623 11.8016 11.7405 11.6111 11.88 11.47L14.44 8.91C14.73 8.62 15.21 8.62 15.5 8.91C15.79 9.2 15.79 9.68 15.5 9.97L13.48 12L15.51 14.03C15.8 14.32 15.8 14.8 15.51 15.09C15.36 15.24 15.17 15.31 14.97 15.31Z"
          fill="#9EA0A2"
        />
      </svg>
    </button>
  }
</div>
