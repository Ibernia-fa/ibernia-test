<!-- sidebar.component.html -->
<div class="d-flex align-items-center justify-content-between">
  @if (showToggle) {
    <a href="javascript:void(0)" (click)="toggleMobileNav.emit()" class="d-flex justify-content-center icon-40 align-items-center f-s-14">
      <i-tabler name="x" class="icon-20 d-flex"></i-tabler>
    </a>
  }
</div>

<!-- menu list -->
<ng-container *ngFor="let item of items">
  <app-nav-item [item]="item" [depth]="0" (notify)="toggleMobileNav.emit()"></app-nav-item>
</ng-container>
