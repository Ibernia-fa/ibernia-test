<app-breadcrumb title="Matteo's Clients"></app-breadcrumb>
<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="row justify-content-between">
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100 hide-hint">
          <input matInput placeholder="Search User" (keyup)="applyFilter($any($event.target).value)" />
          <mat-icon matSuffix>
            <i-tabler name="search" class="icon-20"></i-tabler>
          </mat-icon>
        </mat-form-field>
      </div>
      <div class="col-4 d-flex align-items-center justify-content-end">
        <button mat-flat-button (click)="redirectToAdd()" color="primary">
          Add New Client
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="table-responsive-sm">
      <table mat-table [dataSource]="dataSource" multiTemplateDataRows>
        @for(column of columnsToDisplay; track column) {
        <ng-container matColumnDef="{{ column }}">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 mat-subtitle-1 f-s-14 p-x-24 p-l-0">
            {{ column | titlecase }}
          </th>
          @if (column === 'action') {
          <td mat-cell *matCellDef="let element" class="action-link">
            <a [routerLink]="['./abc/edit']" class=" m-t-15 m-r-10 cursor-pointer"><i-tabler name="edit"
                class="icon-18"></i-tabler></a>
            <a (click)="openDialog('Delete', element)" class="m-t-15 m-r-10 cursor-pointer">
              <i-tabler name="trash" class="icon-18"></i-tabler>
            </a>
          </td>
          }
          @else {
          <td mat-cell *matCellDef="let element" class="p-x-24 f-s-14 p-l-0">
            {{ element[column] }}
          </td>
          }
        </ng-container>
        }
        <!-- <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
            Action
          </th>
          
        </ng-container> -->
        <ng-container matColumnDef="expand">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions">
            &nbsp;
          </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button aria-label="expand row" (click)="
        expandedElement = expandedElement === element ? null : element;
        $event.stopPropagation()
        ">
              @if(expandedElement !== element) {
              <mat-icon>keyboard_arrow_down</mat-icon>
              } @if(expandedElement === element) {
              <mat-icon>keyboard_arrow_up</mat-icon>
              }
            </button>
          </td>
        </ng-container>
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef aria-label="row actions">
            &nbsp;
          </th>
          <td mat-cell *matCellDef="let element">
            <!-- <button mat-icon-button aria-label="expand row" (click)="

            </button> -->
            <span>text</span>
          </td>
        </ng-container>

            <div [@detailExpand]="
        element === expandedElement ? 'expanded' : 'collapsed'
        ">
              <div class="p-15 rounded b-1 m-b-16 m-x-18">
                <div class="d-flex align-items-center gap-12">
                  <span
                    class="bg-light-primary text-primary icon-48 rounded f-w-600 d-flex align-items-center justify-content-center">

        <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>

        <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand" class="example-element-row"
          [class.example-expanded-row]="expandedElement === element"
          (click)="expandedElement = expandedElement === element ? null : element">
        </tr>

        <!-- Expanded Rows -->
        <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithCheckbox" class="example-detail-row"
          [hidden]="expandedElement !== element">
          <ng-container *ngFor="let column of columnsToDisplay">
