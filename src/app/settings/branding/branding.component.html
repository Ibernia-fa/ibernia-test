<!-- branding.component.html -->
<mat-card class="mat-mdc-card mdc-card cardWithShadow mb-20">
  <mat-card-content class="mat-mdc-card-content">
    <h3 class="f-s-20 f-w-400 m-b-5">Company logo</h3>
    <p class="f-s-14 m-b-30 p-t-0 m-t-0">
      Upload your company logo and it will be displayed on the top left corner. Horizontal logo is recommended
    </p>

    <div class="upload-avatar-wrapper upload-company-avatar position-relative">
      <label for="company-logo-input" class="cursor-pointer">
        <div class="text-center">
          <!-- WHEN an image is present, show preview with delete (same as Profile) -->
          <div *ngIf="profileImage; else placeholder" class="image-preview-wrapper ">
            <img
              [src]="profileImage"
              alt="company logo preview"
              class="rounded"
              style="width:120px;height:120px;object-fit:cover;"
            />
            <span class="remove-pic" (click)="clearImage($event)">
              <img src="../../../assets/images/shapes/delete.svg" alt="delete">
            </span>
          </div>

          <!-- ELSE show the selection UI -->
          <ng-template #placeholder>
            <img class="m-b-10" src="../../../assets/images/shapes/small-icon.svg" alt="">
            <p class="text-sm text-gray-500 f-s-14 m-b-10 m-0">
              Click to upload logo<br><span class="underline">or drag and drop</span>
            </p>
            <small class="text-xs text-gray-400 f-s-12 m-0">
              SVG, PNG, JPG or GIF (max. 800×400px)
            </small>
          </ng-template>
        </div>
      </label>

      <!-- Hidden input; reset value after each use so same file can be reselected -->
      <input
        #fileInput
        id="company-logo-input"
        type="file"
        accept="image/*"
        hidden
        (change)="onFileSelected($event)"
      />
    </div>

    <div class="mt-4 text-right">
      <button
        class="button-icon pull-right"
        type="button"
        (click)="save()"
        [disabled]="!profileImage || isSaving"
      >
        <span>{{ isSaving ? 'Saving…' : 'Save' }}</span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
