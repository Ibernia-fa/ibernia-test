<mat-card class="mat-mdc-card mdc-card cardWithShadow mb-20">
  <mat-card-content class="mat-mdc-card-content">
    <h3 class="f-s-20 f-w-400 m-b-8">{{ 'SECURITY_SECTION_PASSWORD_TITLE' | translate }}</h3>
    <p class="sub-title m-b-24">{{ 'SECURITY_SECTION_PASSWORD_SUBTITLE' | translate }}</p>
    <a
      mat-flat-button
      color="primary"
      class="security-action-btn"
      [href]="changePasswordUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ 'SECURITY_OPEN_CHANGE_PASSWORD' | translate }}
    </a>
  </mat-card-content>
</mat-card>

<mat-card class="mat-mdc-card mdc-card cardWithShadow mb-20">
  <mat-card-content class="mat-mdc-card-content">
    <h3 class="f-s-20 f-w-400 m-b-8">{{ 'SECURITY_SECTION_2FA_TITLE' | translate }}</h3>
    <p class="sub-title m-b-24">{{ 'SECURITY_SECTION_2FA_SUBTITLE' | translate }}</p>
    <a
      mat-stroked-button
      color="primary"
      class="security-action-btn"
      [href]="twoFactorUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      {{ 'SECURITY_MANAGE_2FA' | translate }}
    </a>
  </mat-card-content>
</mat-card>
