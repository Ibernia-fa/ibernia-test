<mat-card class="mat-mdc-card mdc-card cardWithShadow mb-20">
  <mat-card-content class="mat-mdc-card-content">
    <div class="d-flex align-items-center main-header-content">
    <div class="header-icon">
      <img src="../../../assets/images/shapes/small-icon-1.svg" alt="">
    </div>
    <div>
   <h2 class="text-xl font-semibold flex items-center f-s-30">
    Account Preferences
  </h2>
  <p class="text-sm text-gray-500 m-0">Update your company photo and details here</p>
  </div>
  </div>
</mat-card-content>  
</mat-card>
<mat-card class="mat-mdc-card mdc-card cardWithShadow mb-20">
    <mat-card-content class="mat-mdc-card-content">

    <h3 class="text-md f-w-400 mb-1 f-s-20">Profile</h3>
    <p class="text-sm text-gray-500 m-0 m-b-20 f-s-14">Update your profile</p>

    <div class="d-flex">
      <!-- Upload Avatar -->
      <div class="upload-avatar-wrapper">
        <label
          for="upload-avatar"
          class="flex items-center justify-center h-40 border border-dashed rounded-md cursor-pointer hover:border-primary transition"
        >
          <div class="text-center">
             <img class="m-b-10" src="../../../assets/images/shapes/small-icon.svg" alt="">
            <p class="text-sm text-gray-500 f-s-14 m-b-10 m-0">Click to upload avatar<br><span class=" underline">or drag and drop</span></p>
            <small class="text-xs text-gray-400 f-s-12 m-0">SVG, PNG, JPG or GIF (max. 800×400px)</small>
          </div>
        </label>
        <input id="upload-avatar" type="file" accept="image/*" hidden (change)="onFileSelected($event)">
      </div>

      <!-- Full Name and Email -->
      <div class="upload-file-info">
          <mat-label class="f-s-16 f-w-400 m-b-8 d-block">Full name</mat-label>

        <mat-form-field appearance="outline" class="w-full w-100">
          <input matInput placeholder="Enter Name">
        </mat-form-field>
          <mat-label class="f-s-16 f-w-400 m-b-8 d-block">Email address</mat-label>

        <mat-form-field appearance="outline" class="w-full  w-100">
          <input matInput type="email" placeholder="Enter Email">
        </mat-form-field>
      </div>
    </div>
 
  </mat-card-content>
</mat-card>

<mat-card  class="mat-mdc-card mdc-card cardWithShadow mb-20">
  <mat-card-content class="mat-mdc-card-content">
     <div class="mt-6 p-4 border rounded-md">
    <h3 class="text-md  f-s-20 f-w-400 m-b-20">Default Preferences</h3>
    
<div class="row">
  <div class="col-12">
        <mat-label class="f-s-16 f-w-400 m-b-8 d-block">Default client currency</mat-label>
         <mat-form-field appearance="outline" class="w-full w-100">
        <input matInput placeholder="€">
      </mat-form-field>
  </div>
</div>
<div class="row">
  <div class="col-6">
        <mat-label class="f-s-16 f-w-400 m-b-8 d-block">Default inflation rate</mat-label>

     <mat-form-field appearance="outline" class="w-full w-100">
        <input matInput type="number" placeholder="2.5%">
      </mat-form-field>
  </div>
  <div class="col-6">
        <mat-label class="f-s-16 f-w-400 m-b-8 d-block">Default investment return</mat-label>

      <mat-form-field appearance="outline" class="w-full w-100">
        <input matInput type="number" placeholder="2%">
      </mat-form-field>
  </div>
  </div>
  

    <div class="mt-4 text-right ">
      <button  class="button-icon pull-right"><span>Save</span></button>
    </div>
  </div>
</mat-card-content>

</mat-card>
