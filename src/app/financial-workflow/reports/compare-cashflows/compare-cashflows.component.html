<div class="w-100">
  <div class="d-flex flex-column">
    <!-- Header -->
    <div class="dialog-header">
      <h2 class="dialog-title text-center">
        {{ "Compare plans" | translate }}
      </h2>
      <button
        type="button"
        mat-icon-button
        disableRipple
        class="dialog-close-btn"
        aria-label="Close dialog"
        (click)="closeDialog()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Body -->
    <mat-dialog-content class="event-dialog-content">
      <p class="f-s-16 f-w-500 m-t-16 m-b-16 compare-subtitle">
        Select plan to compare with {{ baseCashflow?.name }}
      </p>

      <mat-radio-group
        class="d-flex flex-column ibr-custom-radio compare-radio-group"
        [(ngModel)]="selectedOtherId"
      >
        <div
          class="compare-radio-item"
          *ngFor="let cf of otherCashflows"
          (click)="selectedOtherId = cf.id"
        >
          <mat-radio-button [value]="cf.id" labelPosition="before">
            {{ cf.name }}
          </mat-radio-button>
        </div>
      </mat-radio-group>
    </mat-dialog-content>

    <!-- Actions -->
    <div class="row justify-content-end gap-16 modal-action p-t-24">
      <div>
        <button
          type="button"
          class="button-icon-outline w-100 d-block"
          (click)="closeDialog()"
        >
          <span class="f-s-16">{{ "Cancel" | translate }}</span>
        </button>
      </div>
      <div>
        <button
          type="button"
          class="button-icon w-100 d-block"
          (click)="save()"
          [disabled]="!selectedOtherId"
        >
          <span class="f-s-16">Compare</span>
        </button>
      </div>
    </div>
  </div>
</div>
