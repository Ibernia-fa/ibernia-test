<div class="d-flex gap-24 flex-column">
    @if(!isLoaderVisible && client && cashflow) {

    <mat-card class="cardWithShadow">
        <mat-card-content>
            <div class="d-flex flex-column gap-32 timeline-wrapper">
                <div class="card-main-wrapper">
                    <div class="d-flex align-items-center justify-content-between w-100 gap-16 flex-wrap">
                        <div class="d-flex align-items-center gap-16">
                            <!-- Icon  -->
                            <div class="icon-wrapper d-flex align-items-center justify-content-center">
                                <img src="assets/images/svgs/clock-icon-filled.svg" alt="clock" />
                            </div>
                            <!-- End Icon  -->
                            <!-- headings  -->
                            <div class="d-flex flex-column justify-content-between gap-4">
                                <h4 class="page-title f-w-500">Reports</h4>
                                <span class="sub-title">{{client.clientDetails.name}}</span>
                            </div>
                            <!-- End headings  -->
                        </div>
                        <div class="d-flex align-items-center gap-12">
                            <img src="/assets/images/svgs/chart-histogram-two-icon.svg" alt="chart" />
                            <span class="f-s-16">{{cashflow.name}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </mat-card-content>
    </mat-card>

    <!-- <app-timeline-chart [financialTimeline]="financialTimeline" [clientBirthDate]="clientBirthDate" [client]="client"
        (updateTimelines)="updateTimelinesEmittedEvent()"></app-timeline-chart> -->
        <app-savings-bar-stacked-chart></app-savings-bar-stacked-chart>
    }
    @else {
    <div class="h-300">
        <mat-spinner></mat-spinner>
    </div>
    }

    <!-- Event Section  -->
</div>
