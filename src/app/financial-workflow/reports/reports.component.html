<div class="d-flex gap-24 flex-column">
  @if(!isLoaderVisible && client && cashflow) {

  <mat-card class="cardWithShadow">
    <mat-card-content>
      <div class="d-flex flex-column gap-32 timeline-wrapper">
        <div class="card-main-wrapper">
          <div class="d-flex align-items-center justify-content-between w-100 gap-16 flex-wrap">
            <div class="d-flex align-items-center gap-16">
              <!-- Icon  -->
              <div class="icon-wrapper d-flex align-items-center justify-content-center">
                <img width="24" src="assets/images/svgs/inheritance-icon.svg" alt="clock" />
              </div>
              <!-- End Icon  -->
              <!-- headings  -->
              <div class="d-flex flex-column justify-content-between gap-4">
                <h4 class="page-title f-w-500">{{ 'Lifetime Plan' | translate }}</h4>
              </div>
              <!-- End headings  -->
            </div>

            <div class="d-flex align-items-center gap-12">
              <!-- Cashflow name (visible when NOT in comparison mode) -->
              <ng-container *ngIf="!(compareReport || compareCashflow)">
                <div class="d-flex align-items-center gap-8">
                  <button class="button-icon" (click)="onComparePlansClicked()">
                    <span>{{ 'Compare plans' | translate }}</span>
                  </button>
                </div>
              </ng-container>

              <!-- Exit Comparison button (visible when IN comparison mode) -->
              <ng-container *ngIf="compareReport || compareCashflow">
                <button class="button-icon" (click)="exitComparison()">
                  <span>{{ 'Exit Comparison' | translate }}</span>
                </button>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card class="cardWithShadow ">
    <mat-card-content style="padding-bottom: 10px !important;">
      <!-- <div class="icon-financial-label"> -->
        <ng-container *ngIf="!compareReport || !compareCashflow">
          <button matTooltip="{{ 'Full screen' | translate}}" class="button-full-screen" (click)="enterFullscreen()">
            <img width="16" src="../../../assets/images/svgs/full-screen.svg" alt="">
          </button>
        </ng-container>

        <ng-container *ngIf="compareCashflow">
          <p class="compare-chart-name">{{cashflow?.name}}</p>
        </ng-container>

        <div class="shortfall" *ngIf="report">
          <ng-container *ngIf="!hasShortfall; else lossTpl">
            <div class="shortfall-status-profit">
              <span class="icon-bg leaf-bg">
                <img
                  src="../../../assets/images/svgs/leaf.svg"
                  alt="leaf"
                  class="icon-svg"
                />
              </span>
              <span class="status-text">Goals on track and funded</span>
            </div>
          </ng-container>
          <ng-template #lossTpl>
            <div class="shortfall-status-loss">
              <span class="icon-bg flag-bg">
                <img
                  src="../../../assets/images/svgs/triangle-flag.svg"
                  alt="flag"
                  class="icon-svg"
                />
              </span>
              <span class="status-text">
                Savings hit zero at {{ firstShortfallAge }} y.o.
              </span>
            </div>
          </ng-template>
      </div>
    <!-- </div> -->

      <div class="chart-component-wrapper">

        <app-savings-bar-stacked-chart [report]="report" [client]="client"
          [forecastStartDate]="financialTimeline.forecastStartDate"
          [forecastEndDate]="financialTimeline.forecastEndtDate"
          [cashFlowName]="cashflow?.name">
        </app-savings-bar-stacked-chart>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Comparison chart card -->
  <mat-card class="cardWithShadow" *ngIf="compareReport && compareCashflow">
    <mat-card-content style="padding-bottom: 10px !important;">
      <ng-container *ngIf="!compareReport || !compareCashflow">
        <button matTooltip="Full screen" class="button-full-screen" (click)="enterFullscreen(true)">
          <img width="20" src="../../../assets/images/svgs/full-screen.svg" alt="">
        </button>
      </ng-container>

      <ng-container *ngIf="compareCashflow">
        <p class="compare-chart-name">{{compareCashflow?.name}}</p>
      </ng-container>

      <div class="d-flex flex-column">
        <div class="shortfall" *ngIf="report">
            <ng-container *ngIf="!hasShortfall; else lossTpl">
              <div class="shortfall-status-profit">
                <span class="icon-bg leaf-bg">
                  <img
                    src="../../../assets/images/svgs/leaf.svg"
                    alt="leaf"
                    class="icon-svg"
                  />
                </span>
                <span class="status-text">Goals on track and funded</span>
              </div>
            </ng-container>
            <ng-template #lossTpl>
              <div class="shortfall-status-loss">
                <span class="icon-bg flag-bg">
                  <img
                    src="../../../assets/images/svgs/triangle-flag.svg"
                    alt="flag"
                    class="icon-svg"
                  />
                </span>
                <span class="status-text">
                  Savings hit zero at {{ firstShortfallAge }} y.o.
                </span>
              </div>
            </ng-template>
      </div>
      <div class="chart-component-wrapper">
        <app-savings-bar-stacked-chart [report]="compareReport" [client]="client"
        [forecastStartDate]="compareTimeline?.forecastStartDate || financialTimeline.forecastStartDate"
        [forecastEndDate]="compareTimeline?.forecastEndtDate || financialTimeline.forecastEndtDate"
        [cashFlowName]="compareCashflow?.name">
      </app-savings-bar-stacked-chart>
    </div>
    </div>
    </mat-card-content>
  </mat-card>

  <!-- show loading while second plan is being fetched -->
  <div class="h-300 d-flex align-items-center justify-content-center" *ngIf="isCompareLoading">
    <mat-spinner></mat-spinner>
  </div>
  
  }
  @else {
  <div class="h-300">
    <mat-spinner></mat-spinner>
  </div>
  }
</div>
