<div class="d-flex gap-24 flex-column">
    @if(!isLoaderVisible && client && cashflow) {

    <mat-card class="cardWithShadow">
        <mat-card-content>
            <div class="d-flex flex-column gap-32 timeline-wrapper">
                <div class="card-main-wrapper">
                    <div class="d-flex align-items-center justify-content-between w-100 gap-16 flex-wrap">
                        <div class="d-flex align-items-center gap-16">
                            <!-- Icon  -->
                            <div class="icon-wrapper d-flex align-items-center justify-content-center">
                                <img width="24" src="assets/images/svgs/inheritance-icon.svg" alt="clock" />
                            </div>
                            <!-- End Icon  -->
                            <!-- headings  -->
                            <div class="d-flex flex-column justify-content-between gap-4">
                                <h4 class="page-title f-w-500">Lifetime Plan</h4>
                                <span class="sub-title">{{client.clientDetails.firstName}}
                                    {{client.clientDetails.lastName}}</span>
                            </div>
                            <!-- End headings  -->
                        </div>
                        <div class="d-flex  gap-12 align-items-end">
                            <img src="/assets/images/svgs/chart-histogram-two-icon.svg" alt="chart" />
                            <span class="f-s-16 underline">{{cashflow.name}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
    <mat-card class="cardWithShadow ">
        <mat-card-content style="padding-bottom: 10px !important;">


            <button matTooltip="Full screen" class="button-full-screen"><img width="20"
                    src="../../../assets/images/svgs/full-screen.svg" alt=""></button>



            <div class="d-flex flex-column gap-32">

                <app-savings-bar-stacked-chart [report]="report" [client]="client"
                    [forecastStartDate]="financialTimeline.forecastStartDate"
                    [forecastEndDate]="financialTimeline.forecastEndtDate"></app-savings-bar-stacked-chart>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card class="cardWithShadow">
        <mat-card-content>
            <div class="d-flex justify-content-between">

                <div class="d-flex align-items-center gap-24">
                    <div class="d-flex align-items-center gap-8">
                        <img src="../../../assets/images/svgs/graph-.svg" width="16" alt="">
                        <label>Inflation rate:</label>
                        <img src="../../../assets/images/svgs/help-circle-icon.svg" width="19" alt="">
                    </div>
                    <div class="d-flex align-items-center gap-24" [formGroup]="savingsForm">
                        <div class="slider-customizer slider-wrapper">

                            <mat-slider class="w-100" [min]="0" [max]="10" [step]="0.5">
                                <input matSliderThumb formControlName="returnRate" (input)="onSliderInput($event)" />
                            </mat-slider>

                        </div>
                        <div class="percentage-field">
                            <div class="w-100 form-field ">
                                <mat-form-field appearance="outline" class="w-full w-100 percentage-icon">
                                    <span matSuffix>%</span>
                                    <input matInput type="number" class="p-0" formControlName="returnRate"
                                        (input)="onReturnRateInput($event)" />

                                </mat-form-field>
                            </div>
                        </div>
                    </div>

                </div>
                <button class="button-icon" (click)="onComparePlansClicked()"><span>Compare plans</span></button>
            </div>
        </mat-card-content>
    </mat-card>

    }
    @else {
    <div class="h-300">
        <mat-spinner></mat-spinner>
    </div>
    }

</div>
