<div class="d-flex gap-24 flex-column">
    @if(!isLoaderVisible && client && cashflow) {

    <mat-card class="cardWithShadow">
        <mat-card-content>
            <div class="d-flex flex-column gap-32 timeline-wrapper">
                <div class="card-main-wrapper">
                    <div class="d-flex align-items-center justify-content-between w-100 gap-16 flex-wrap">
                        <div class="d-flex align-items-center gap-16">
                            <!-- Icon  -->
                            <div class="icon-wrapper d-flex align-items-center justify-content-center">
                                <img width="24" src="assets/images/svgs/inheritance-icon.svg" alt="clock" />
                            </div>
                            <!-- End Icon  -->
                            <!-- headings  -->
                            <div class="d-flex flex-column justify-content-between gap-4">
                                <h4 class="page-title f-w-500">Lifetime Plan</h4>
                                <span class="sub-title">{{client.clientDetails.firstName}} {{client.clientDetails.lastName}}</span>
                            </div>
                            <!-- End headings  -->
                        </div>
                        <div class="d-flex  gap-12 align-items-end">
                            <img src="/assets/images/svgs/chart-histogram-two-icon.svg" alt="chart" />
                            <span class="f-s-16 underline">{{cashflow.name}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </mat-card-content>
    </mat-card>
    

 <div class="cashflow-stats">
                    <div class="cashflow-grid">
                        <div class="stats-main-wrapper">
                            <div class="d-flex align-items-center gap-8">
                                <h3 class="card-title">Savings at start (age 58):</h3>
                                <h3 class="saving-title">£1,281,000</h3>
                            </div>
                        </div>
                        <div class="divider"></div>
                        <div class="stats-main-wrapper">
                            <div class="d-flex align-items-center gap-8">
                                <h3 class="card-title">Savings at retirement (age 60):</h3>
                                <h3 class="saving-title">£1,314,562</h3>
                            </div>
                        </div>
                        <div class="divider"></div>
                        <div class="stats-main-wrapper">
                            <div class="d-flex align-items-center gap-8">
                                <h3 class="card-title">Savings at end (age 100):</h3>
                                <h3 class="saving-title">£141,459</h3>
                            </div>
                        </div>
                    </div>
                </div>






    <mat-card class="cardWithShadow">
        <mat-card-content>


<button matTooltip="Full screen"
         class="button-full-screen"><img width="20" src="../../../assets/images/svgs/full-screen.svg" alt=""></button>


            
            <div class="d-flex flex-column gap-32">
               
                <app-savings-bar-stacked-chart [report]="report" [client]="client"
                [forecastStartDate]="financialTimeline.forecastStartDate" [forecastEndDate]="financialTimeline.forecastEndtDate"></app-savings-bar-stacked-chart>
            </div>
        </mat-card-content>
    </mat-card>

    <mat-card class="cardWithShadow">
   <mat-card-content>
      <div class="d-flex justify-content-between">
     
         <div class="d-flex align-items-center gap-24">
         <div class="d-flex align-items-center gap-8">
            <img src="../../../assets/images/svgs/graph-.svg" width="16" alt="">
            <label>Inflation rate:</label>
            <img src="../../../assets/images/svgs/help-circle-icon.svg" width="19" alt="">
        </div>
            <div class="slider-customizer slider-wrapper">
               <mat-slider class="w-100">
                  <input value="30"  matSliderThumb>
               </mat-slider>
            </div>
            <div class="percentage-field">
               <div class="w-100 form-field">
                  <input style="width:65px ;" placeholder="No." value="8.5%" />
               </div>
            </div>
         </div>
         <button class="button-icon"><span>Compare plans</span></button>
      </div>
   </mat-card-content>
</mat-card> 

    }
    @else {
    <div class="h-300">
        <mat-spinner></mat-spinner>
    </div>
    }

    <!-- Event Section  -->
</div>
