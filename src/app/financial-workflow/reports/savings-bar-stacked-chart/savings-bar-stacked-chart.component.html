<div id="chart">

        [yaxis]="chartOptions.yaxis" [dataLabels]="chartOptions.dataLabels" [annotations]="chartOptions.annotations"
        [tooltip]="chartOptions.tooltip" [fill]="chartOptions.fill" [legend]="chartOptions.legend"
        [grid]="chartOptions.grid">
    </apx-chart>
</div>
