<div class="credentials-dialog d-flex flex-column w-100">
  <div class="credentials-header">
    <h2 class="credentials-title">
      {{ "SHARE.CREDENTIALS_TITLE" | translate }}
    </h2>
    <button
      type="button"
      mat-icon-button
      disableRipple
      class="credentials-close"
      mat-dialog-close
      aria-label="Close dialog"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="credentials-dialog-content">
    <p class="credentials-hint info-text">
      {{ "SHARE.CREDENTIALS_HINT" | translate }}
    </p>

    <div class="credential-field">
      <span class="credential-label">{{
        "SHARE.CREDENTIALS_LINK_LABEL" | translate
      }}</span>
      <div class="credential-box" tabindex="0">{{ data.shareableUrl }}</div>
    </div>

    <div class="credential-field">
      <span class="credential-label">{{
        "SHARE.CREDENTIALS_PASSWORD_LABEL" | translate
      }}</span>
      <div class="credential-box credential-box--mono" tabindex="0">
        {{ data.password }}
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions
    align="end"
    class="credentials-actions modal-action d-flex justify-content-end gap-16 flex-wrap"
  >
    <button type="button" mat-dialog-close class="button-icon-outline d-block">
      <span class="f-s-16">{{ "Close" | translate }}</span>
    </button>
    <button type="button" (click)="copyAll()" class="button-icon d-block">
      <span class="f-s-16">{{ "SHARE.COPY_AGAIN" | translate }}</span>
    </button>
  </mat-dialog-actions>
</div>
