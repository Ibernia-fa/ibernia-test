<div class="d-flex gap-24 flex-column">
  <mat-card class="cardWithShadow">
    <mat-card-content>
      <h4 class="page-title f-w-500 f-s-30">AI Chat</h4>
      <p class="text-muted m-t-8">Ask follow-up questions about this cashflow plan. The AI uses the same plan data as recommendations.</p>
    </mat-card-content>
  </mat-card>

  <mat-card class="cardWithShadow">
    <mat-card-content>
      <div class="d-flex flex-column gap-16">
        <div class="d-flex gap-16 flex-wrap align-items-center">
          <button mat-flat-button color="primary" (click)="startNewConversation()" [disabled]="sending">
            New conversation
          </button>
          <ng-container *ngIf="conversations.length > 0">
            <span class="text-muted">Conversations:</span>
            <button
              *ngFor="let c of conversations"
              mat-stroked-button
              [color]="conversationId === c.id ? 'primary' : ''"
              (click)="selectConversation(c.id)">
              {{ c.created | date:'short' }}
            </button>
          </ng-container>
        </div>

        <ng-container *ngIf="error">
          <div class="text-error">{{ error }}</div>
        </ng-container>

        <ng-container *ngIf="conversationId">
          <div class="chat-messages border rounded p-16" style="min-height: 200px; max-height: 400px; overflow-y: auto;">
            <ng-container *ngIf="loading">
              <mat-spinner diameter="32"></mat-spinner>
            </ng-container>
            <ng-container *ngIf="!loading && messages.length === 0">
              <p class="text-muted">No messages yet. Type below to start.</p>
            </ng-container>
            <div *ngFor="let m of messages" class="m-b-12" [class.text-end]="m.role === 'User'">
              <span class="fw-500">{{ m.role }}:</span>
              <div [class.bg-light]="m.role === 'Assistant'" class="p-8 rounded" [class.d-inline-block]="m.role === 'User'">
                {{ m.content }}
              </div>
            </div>
          </div>

          <div class="d-flex gap-8 align-items-center">
            <mat-form-field appearance="outline" class="flex-grow-1">
              <mat-label>Your message</mat-label>
              <input matInput [(ngModel)]="inputText" (keydown.enter)="$event.preventDefault(); send()" placeholder="e.g. Why did you suggest that?" />
            </mat-form-field>
            <button mat-flat-button color="primary" (click)="send()" [disabled]="sending || !inputText?.trim()">
              {{ sending ? 'Sending...' : 'Send' }}
            </button>
          </div>
        </ng-container>

        <ng-container *ngIf="!conversationId && conversations.length === 0 && !sending">
          <p class="text-muted">Start a conversation to ask questions about this plan.</p>
        </ng-container>
      </div>
    </mat-card-content>
  </mat-card>
</div>
