<div class="d-flex gap-24 flex-column">
  <mat-card class="cardWithShadow">
    <mat-card-content>
      <div class="d-flex flex-column gap-32 timeline-wrapper">
        <div class="card-main-wrapper">
          <div
            class="d-flex align-items-center justify-content-between w-100 gap-16 flex-wrap"
          >
            <div class="d-flex align-items-center gap-16">
              <!-- Icon  -->
              <div
                class="icon-wrapper d-flex align-items-center justify-content-center"
              >
                <img src="assets/images/svgs/clock-icon.svg" alt="clock" />
              </div>
              <!-- End Icon  -->
              <!-- headings  -->
              <div class="d-flex flex-column justify-content-between gap-4">
                <h4 class="page-title f-w-500">Timeline</h4>
                <span class="sub-title">John Devidson</span>
              </div>
              <!-- End headings  -->
            </div>
            <div class="d-flex align-items-center gap-12">
              <img
                src="/assets/images/svgs/chart-histogram-two-icon.svg"
                alt="chart"
              />
              <span class="f-s-16">Cashflow Simulator #1</span>
            </div>
          </div>
        </div>
        <!-- Date Fields  -->
        <div class="row justify-content-between align-items-end flex-nowrap">
          <div class="col-6">
            <div class="w-100 form-field gap-12">
              <div class="d-flex gap-8 align-items-center">
                <mat-label class="f-s-16 f-w-400 d-block"
                  >Forecast start date:</mat-label
                >
                <img
                  src="assets/images/svgs/help-circle-icon.svg"
                  alt="help-circle-icon"
                />
              </div>
              <div class="position-relative">
                <input
                  matInput
                  [matDatepicker]="picker"
                  formControlName="start_date"
                />
                <div class="date-picker-position">
                  <mat-datepicker-toggle matIconSuffix [for]="picker">
                    <mat-icon matDatepickerToggleIcon>
                      <img
                        src="assets/images/svgs/pen-icon.svg"
                        alt="pen-icon"
                      />
                    </mat-icon>
                  </mat-datepicker-toggle>
                </div>
                <mat-datepicker #picker></mat-datepicker>
              </div>
            </div>
          </div>
          <div class="d-flex justify-content-end align-items-end">
            <img
              src="assets/images/svgs/chevron-right-date-icon.svg"
              alt="chevron-right-date-icon"
            />
          </div>
          <div class="col-6">
            <div class="w-100 form-field gap-12">
              <div class="d-flex gap-8 align-items-center">
                <mat-label class="f-s-16 f-w-400 d-block"
                  >Forecast end date:</mat-label
                >
                <img
                  src="assets/images/svgs/help-circle-icon.svg"
                  alt="help-circle-icon"
                />
              </div>
              <div class="position-relative">
                <input
                  matInput
                  [matDatepicker]="pickerend"
                  formControlName="end_date"
                />
                <div class="date-picker-position">
                  <mat-datepicker-toggle matIconSuffix [for]="pickerend">
                    <mat-icon matDatepickerToggleIcon>
                      <img
                        src="assets/images/svgs/pen-icon.svg"
                        alt="pen-icon"
                      />
                    </mat-icon>
                  </mat-datepicker-toggle>
                </div>
                <mat-datepicker #pickerend></mat-datepicker>
              </div>
            </div>
          </div>
        </div>
        <!-- End Date Fields  -->
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Event Section  -->
  <mat-card class="cardWithShadow">
    <mat-card-content>
      <div
        class="d-flex align-items-center justify-content-between flex-wrap gap-16 event-main-wrapper"
      >
        <div class="d-flex flex-column gap-6" style="flex-direction: column">
          <h4 class="f-s-22 f-w-400">Events</h4>
          <p class="m-0">
            Drag new events onto the timeline, or drag to re-arrange existing
            events. <br />
            The start and end date of transactions such as incomes can be linked
            to events.
          </p>
        </div>
        <button type="button" class="button-icon">
          <span>New Event</span>
          <img src="assets/images/svgs/add-icon.svg" alt="add-icon" />
        </button>

      </div>
      <div #timelineContainer class="timeline"></div>
    </mat-card-content>
  </mat-card>
  <!-- Event Section  -->
</div>
