<h2 mat-dialog-title>Add Family Member</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Relationship</mat-label>
      <mat-select formControlName="role" [hideSingleSelectionIndicator]="true">
        @for (opt of roleOptions; track opt.value) {
          <mat-option [value]="opt.value" [disabled]="opt.disabled">{{opt.label}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="dialog-btn dialog-btn-cancel" (click)="onCancel()">Cancel</button>
  <button class="dialog-btn dialog-btn-save" [disabled]="form.invalid || isSaving" (click)="onSave()">
    Save
  </button>
</mat-dialog-actions>
