<form class="d-flex flex-column gap-32" [formGroup]="form" (ngSubmit)="onSave()">
  <div class="d-flex align-items-center justify-content-between gap-10 modal-header">
    <h3>{{ isEditMode ? 'Edit asset' : 'Add asset' }}</h3>
    <button (click)="onCancel()" type="button" class="close-btn">
      <img src="assets/images/svgs/close-line-cion.svg" alt="close" />
    </button>
  </div>

  <mat-dialog-content class="d-flex flex-column gap-20">
    <div class="w-100 form-field gap-8">
      <mat-label class="f-s-16 d-block" style="line-height: 18px">Category</mat-label>
      <div class="select-option">
        <mat-select formControlName="category" placeholder="Select category" (selectionChange)="onCategoryChange()">
          <mat-option *ngFor="let cat of categories" [value]="cat.value">
            {{ cat.label }}
          </mat-option>
        </mat-select>
      </div>
    </div>

    <div class="w-100 form-field gap-8">
      <mat-label class="f-s-16 d-block" style="line-height: 18px">Description</mat-label>
      <input matInput formControlName="description" placeholder="e.g. Primary residence" />
      <span *ngIf="form.get('description')?.touched && form.get('description')?.hasError('required')" class="field-error d-block">Required</span>
    </div>

    <div class="w-100 form-field gap-8">
      <mat-label class="f-s-16 d-block" style="line-height: 18px">Value</mat-label>
      <input matInput type="number" formControlName="value" placeholder="0" />
      <span *ngIf="form.get('value')?.touched && form.get('value')?.hasError('required')" class="field-error d-block">Required</span>
    </div>

    <div class="w-100 form-field gap-8">
      <mat-label class="f-s-16 d-block" style="line-height: 18px">Liquidity</mat-label>
      <div class="select-option">
        <mat-select formControlName="liquidity" placeholder="Select liquidity">
          <mat-option *ngFor="let liq of liquidityLevels" [value]="liq.value">
            {{ liq.label }}
          </mat-option>
        </mat-select>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="d-flex justify-content-between align-items-center">
    <div>
      <button *ngIf="isEditMode" type="button" mat-button color="warn" (click)="onDelete()" [disabled]="isSaving">
        Delete
      </button>
    </div>
    <div class="d-flex gap-10">
      <button type="button" mat-button (click)="onCancel()">Cancel</button>
      <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid || isSaving">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </div>
  </mat-dialog-actions>
</form>
