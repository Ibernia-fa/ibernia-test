  <div class="d-flex flex-column gap-32">
    <div class="d-flex align-items-center justify-content-between gap-10 modal-header">
      <h3>Add cover</h3>
      <button (click)="closeDialog()" type="button">
        <img src="assets/images/svgs/close-line-cion.svg" alt="close-line-cion" />
      </button>
    </div>
  <mat-dialog-content class="d-flex flex-column gap-20">
           <div class="w-100 form-field gap-8">
          <mat-label class="f-s-16 d-block" style="line-height: 18px">Name</mat-label>
          <input matInput  placeholder="e.g. Pats" />

        </div>
            <div class="w-100 form-field gap-8">
          <mat-label class="f-s-16 d-block" style="line-height: 18px">Status</mat-label>
                <div class="select-option">
                      <mat-select value="Select" formControlName="end" hideSingleSelectionIndicator>
                          <mat-option>ab</mat-option>
                      </mat-select>
                    </div>

        </div>      




        <div class="d-flex flex-column gap-4 net-fields">
          <div class="d-flex flex-column gap-8">
            <mat-label class="f-s-16 d-block" style="line-height: 18px">Insurance cost</mat-label>
            <div class="net-field d-flex align-items-center">
              <div class="w-100 form-field">

              <span class="icon-percentage" matSuffix>%</span>
                <input
                  matInput
                  type="text"
                 
                />
       
              </div>
              <div class="right">
                
                <mat-select   class="sortby-edit-profile"  >
                  
                      <mat-option >ab</mat-option> <mat-option >ab</mat-option>
                </mat-select>
              </div>
            </div>
          </div>
        </div>
                 <div class="w-100 form-field gap-8">
          <mat-label class="f-s-16 d-block" style="line-height: 18px">Coverage adequacy</mat-label>
          <div class="select-option">
                      <mat-select value="Select" formControlName="end" hideSingleSelectionIndicator>
                          <mat-option>ab</mat-option>
                      </mat-select>
                    </div>

        </div>   



<div class="w-100 form-field gap-8">

             <mat-label class="f-s-16 f-w-400 d-flex align-items-center">
              Coverage 
            </mat-label>
            <mat-form-field appearance="outline" class="w-100 percentage-icon">
              <span matSuffix>%</span>
              <input matInput type="number" />
            
            </mat-form-field>


            </div>
  </mat-dialog-content>

    <div class="row justify-content-between modal-action">
      <div class="col-5">
        <button  class="button-icon-outline w-100 d-block">
          <span class="f-s-16">Cancel</span>
        </button>
      </div>
      <div class="col-5">
        <button  type="button"  class="button-icon w-100 d-block">
          <span class="f-s-16">Save</span>
        </button>
      </div>
    </div>

    </div>
