      <h2 mat-dialog-title>Add Emergency</h2>

<form [formGroup]="form" (ngSubmit)="save()" class="dialog-form">
  <mat-dialog-content>

    <!-- Basic details -->
    <div class="row">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g., Life Insurance" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let t of emergencyTypes" [value]="t.id">{{ t.name }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('type')?.hasError('required')">Type is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="half">
        <mat-label>Icon URL</mat-label>
        <input matInput formControlName="iconUrl" placeholder="https://…/icon.svg" />
      </mat-form-field>

      <mat-slide-toggle class="full m-t-8" formControlName="isHidden">Hidden</mat-slide-toggle>
    </div>

    <!-- Insurance section (shown when type === 1) -->
    <div *ngIf="form.get('type')?.value === 1" class="section">
      <h3 class="section-title">Insurance Details</h3>

      <div class="row">
        <mat-form-field appearance="outline" class="half">
          <mat-label>Policy Status</mat-label>
          <mat-select formControlName="policyStatus">
            <mat-option *ngFor="let s of policyStatuses" [value]="s.id">{{ s.name }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half">
          <mat-label>Coverage</mat-label>
          <input matInput type="number" formControlName="coverage" placeholder="0" />
          <span matSuffix>%&nbsp;</span>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half">
          <mat-label>Coverage Adequacy</mat-label>
          <mat-select formControlName="coverageAdequacy">
            <mat-option *ngFor="let c of coverageAdequacies" [value]="c.id">
              {{ c.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline" class="quarter">
          <mat-label>Currency</mat-label>
          <input matInput formControlName="insuranceCost.currencySymbol" placeholder="£ / $ / AED" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="half">
          <mat-label>Insurance Cost</mat-label>
          <input matInput type="number" formControlName="insuranceCost.amount" placeholder="0" />
        </mat-form-field>

        <!-- Optional: cycle id/description if you have a list; else keep as free text -->
        <mat-form-field appearance="outline" class="quarter">
          <mat-label>Cycle (Id)</mat-label>
          <input matInput formControlName="insuranceCost.cycle.id" placeholder="e.g., monthly" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Cycle (Description)</mat-label>
          <input matInput formControlName="insuranceCost.cycle.description" placeholder="e.g., Monthly premium" />
        </mat-form-field>
      </div>
    </div>

    <!-- Will section (shown when type === 2) -->
    <div *ngIf="form.get('type')?.value === 2" class="section">
      <h3 class="section-title">Will Details</h3>

      <div class="row">
        <mat-form-field appearance="outline" class="half">
          <mat-label>Will Status</mat-label>
          <mat-select formControlName="willStatus">
            <mat-option *ngFor="let w of willStatuses" [value]="w.id">{{ w.name }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button mat-dialog-close type="button">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
  </mat-dialog-actions>
</form>

<!-- Simple styles to get a clean two-column layout -->
<style>
  .dialog-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .dialog-form .full { grid-column: 1 / -1; }
  .dialog-form .half { grid-column: span 1; }
  .dialog-form .quarter { grid-column: span 1; }
  .dialog-form .section { margin-top: 12px; }
  .dialog-form .section-title { margin: 0 0 8px; font-weight: 500; font-size: 14px; opacity: 0.8; }
  .m-t-8 { margin-top: 8px; }
  @media (max-width: 768px) {
    .dialog-form .row { grid-template-columns: 1fr; }
    .dialog-form .half, .dialog-form .quarter, .dialog-form .full { grid-column: 1 / -1; }
  }
</style>
