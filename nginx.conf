server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /index.html;

    # Never cache index.html so clients get latest script/chunk references (dev build now uses outputHashing: all)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Long cache for fingerprinted bundles (e.g. chunk-AB12CD34.js, styles-XYZ.css)
    location ~* \.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]+\.(js|css)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Short cache with revalidation for non-hashed assets (SVGs, images, fonts)
    location ~* \.(?:ico|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, must-revalidate";
    }
}
