server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /index.html;

    # Never cache index.html so clients get latest script/chunk references (dev build now uses outputHashing: all)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    # Long cache for hashed assets (lazy chunks, etc.); entry scripts handled above
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
